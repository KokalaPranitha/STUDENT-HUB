services:
  - type: web
    name: studenthub-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: studenthub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: studenthub-db
    plan: free
    region: oregon
    databaseName: studenthub_db
    user: root
