# ==============================================================================
# StudentHub - Spring Boot Configuration
# ==============================================================================

spring.application.name=studenthub-backend
server.port=${PORT:8080}

# --- Database Configuration ---
# Defaults to embedded H2 database (MySQL compatibility mode) so deployment works with ZERO environment variables!
# When external cloud MySQL is provided via SPRING_DATASOURCE_URL, it automatically switches to MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/studenthub_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- JWT Configuration ---
app.jwt.secret=${JWT_SECRET:4a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c7d9e1f3a5b7c9d1e3f5a7b}
app.jwt.expiration-milliseconds=86400000

# --- Logging Configuration ---
logging.level.com.studenthub=INFO
logging.level.org.springframework.security=WARN
