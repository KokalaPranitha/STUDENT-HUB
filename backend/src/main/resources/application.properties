# ==============================================================================
# StudentHub - Spring Boot Configuration
# ==============================================================================

spring.application.name=studenthub-backend
server.port=8080

# --- MySQL Database Configuration ---
spring.datasource.url=jdbc:mysql://localhost:3306/studenthub_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT Configuration ---
app.jwt.secret=4a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c7d9e1f3a5b7c9d1e3f5a7b
app.jwt.expiration-milliseconds=86400000

# --- Logging Configuration ---
logging.level.com.studenthub=INFO
logging.level.org.springframework.security=WARN
